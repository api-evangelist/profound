            maximum: 5.0
            minimum: 1.0
          - type: 'null'
          title: Impact
        reference_url:
          anyOf:
          - type: string
            maxLength: 2048
            minLength: 1
          - type: 'null'
          title: Reference Url
        reference_label:
          anyOf:
          - type: string
            maxLength: 240
            minLength: 1
          - type: 'null'
          title: Reference Label
        position:
