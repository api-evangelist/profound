          type: array
          title: Topics
        prompts:
          items:
            type: string
          type: array
          title: Prompts
        measurement:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Measurement
        source_kind:
          type: string
          enum:
          - generate
          - adhoc
          title: Source Kind
          default: adhoc
        source_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Prompt
        status:
          type: string
          enum:
          - suggested
          - tracked
          - retired
          title: Status
          default: tracked
        task_count:
          type: integer
          minimum: 0.0
          title: Task Count
          default: 0
        new_task_count:
          type: integer
          minimum: 0.0
          title: New Task Count
          default: 0
        retired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Retired At
        retired_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Retired Reason
        latest_version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Latest Version Id
        version_count:
          type: integer
          minimum: 0.0
          title: Version Count
          default: 0
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        live_generation:
          anyOf:
          - $ref: '#/components/schemas/LiveGeneration'
          - type: 'null'
        tasks:
          items:
            $ref: '#/components/schemas/ProjectTask'
          type: array
          title: Tasks
