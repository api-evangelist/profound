      - category_id
      - title
      title: ProjectDetail
    ProjectStatusResponse:
      properties:
        data:
          $ref: '#/components/schemas/ProjectStatusPayload'
      additionalProperties: false
      type: object
      required:
      - data
      title: ProjectStatusResponse
    CreateProjectTaskRequest:
      properties:
        title:
          type: string
          maxLength: 240
          minLength: 1
          title: Title
        summary:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
          - type: 'null'
          title: Summary
        brief:
          anyOf:
