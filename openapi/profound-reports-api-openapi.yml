    YoutubeChannelsQuery:
      properties:
        category_id:
          type: string
          format: uuid
          title: Category Id
        start_date:
          type: string
          title: Start Date
          description: YYYY-MM-DD, ET, inclusive
        end_date:
          type: string
          title: End Date
          description: YYYY-MM-DD, ET, inclusive
        filter:
          anyOf:
          - $ref: '#/components/schemas/FilterNode'
          - type: 'null'
          description: 'Advanced filter tree. Prompt-level dimensions are `model`, `topic`, `region`, `prompt`, `persona`, `tag`, `analysis_type`. `channel` covers both channel cases: `in` with a list of handles selects exactly those channels, resolving each handle to its channel so a renamed channel is never returned in pieces; `contains` matches a channel''s title or handle by name. Combine with `and`/`or`/`not` up to 3 deep. An exact `channel` selection must be its own `and` clause, and a `channel` leaf cannot share an `or` or `not` with a prompt-level leaf, because those compile at different stages of the query. `domain` and `page` are rejected rather than approximated: every row here is one domain, and `page` is not a video id.'
        limit:
          anyOf:
          - type: integer
            maximum: 50.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Limit
          description: Page size; default 10, max 50.
        cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        source_types:
          anyOf:
          - items:
              type: string
              enum:
              - video
              - short
              - channel
              - playlist
              - other
            type: array
          - type: 'null'
          title: Source Types
          description: 'Limit results to YouTube source types: `video`, `short`, `channel`, `playlist`, or `other`. Omit to include `video`, `short`, `channel`, and `playlist`; `other` is excluded because those citations have no channel. Requests containing `other` are rejected.'
        group_by:
          items:
            type: string
            enum:
            - channel
            - video_category
            - model
            - source_type
          type: array
          title: Group By
          description: What each row represents. Empty or `["channel"]` ranks channels; `["video_category"]` ranks content categories; `["source_type"]` ranks source types; `["channel", "video_category"]`, `["channel", "source_type"]` and `["channel", "model"]` return cross-tabs — a row per channel per category, or per answer engine. `limit` counts leading channels in every case, so ten channels across nine engines is ten channels and ninety rows.
        interval:
          anyOf:
          - type: string
            enum:
            - day
            - week
            - month
          - type: 'null'
          title: Interval
          description: 'Return a time series instead of window totals: one row per entity per period, each carrying `date`. `citation_share` is then relative to that period, so the series is comparable across periods. Omit for window totals.'
      additionalProperties: false
      type: object
      required:
      - category_id
      - start_date
      - end_date
      title: YoutubeChannelsQuery
      description: Channel and category rollups.
