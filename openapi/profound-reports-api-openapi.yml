    YoutubeVideosQuery:
      properties:
        category_id:
          type: string
          format: uuid
          title: Category Id
        start_date:
          type: string
          title: Start Date
          description: YYYY-MM-DD, ET, inclusive
        end_date:
          type: string
          title: End Date
          description: YYYY-MM-DD, ET, inclusive
        filter:
          anyOf:
          - $ref: '#/components/schemas/FilterNode'
          - type: 'null'
          description: 'Advanced filter tree. Prompt-level dimensions are `model`, `topic`, `region`, `prompt`, `persona`, `tag`, `analysis_type`. `channel` covers both channel cases: `in` with a list of handles selects exactly those channels, resolving each handle to its channel so a renamed channel is never returned in pieces; `contains` matches a channel''s title or handle by name. Combine with `and`/`or`/`not` up to 3 deep. An exact `channel` selection must be its own `and` clause, and a `channel` leaf cannot share an `or` or `not` with a prompt-level leaf, because those compile at different stages of the query. `domain` and `page` are rejected rather than approximated: every row here is one domain, and `page` is not a video id.'
        limit:
          anyOf:
          - type: integer
            maximum: 50.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Limit
          description: Page size; default 10, max 50.
        cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        source_types:
          anyOf:
          - items:
              type: string
              enum:
              - video
              - short
              - channel
              - playlist
              - other
            type: array
          - type: 'null'
          title: Source Types
          description: 'Limit results to YouTube source types: `video`, `short`, `channel`, `playlist`, or `other`. Omit to include `video` and `short` with the default `attribution=''attributed''`; `unattributed` and `all` widen the default to all five source types. Requests containing `other` with `attribution=''attributed''` are rejected.'
        attribution:
          type: string
          enum:
          - attributed
          - unattributed
          - all
          title: Attribution
          description: 'Choose attributed citations, unattributed citations, or all citations. An unattributed row has no channel: `source_type` is `other` for a search or feed URL that names no source, and any other type is a source we have no channel for.'
          default: attributed
      additionalProperties: false
      type: object
      required:
      - category_id
      - start_date
      - end_date
      title: YoutubeVideosQuery
      description: Cited videos, optionally narrowed to specific channels.
