    SentimentV2ReportQuery:
      properties:
        category_id:
          type: string
          format: uuid
          title: Category Id
        asset_name:
          type: string
          title: Asset Name
        start_date:
          type: string
          format: date-time
          title: Start Date
          description: 'Start date for the report. Accepts formats: YYYY-MM-DD, YYYY-MM-DD HH:MM, or full ISO timestamp.'
        end_date:
          type: string
          format: date-time
          title: End Date
          description: 'End date for the report. Accepts formats: YYYY-MM-DD, YYYY-MM-DD HH:MM, or full ISO timestamp.'
        comparison_start_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Comparison Start Date
          description: Start of the previous period for delta computation.
        comparison_end_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Comparison End Date
          description: End of the previous period for delta computation.
        date_bucket:
          type: string
          enum:
          - day
          - week
          - month
          title: Date Bucket
          description: Date bucket for the report. Only used when dimensions includes date.
          default: day
        dimensions:
          items:
            type: string
            enum:
            - date
            - topic
            - region
            - model
            - prompt
            - persona
            - tag
            - theme
            - claim
            - run
            - asset_name
          type: array
          title: Dimensions
          description: Dimensions to group the report by.
        metrics:
          items:
            type: string
            enum:
            - sentiment
            - occurrence
          type: array
          title: Metrics
        filters:
          items:
            oneOf:
            - $ref: '#/components/schemas/SentimentV2ModelIdFilter'
            - $ref: '#/components/schemas/SentimentV2RegionIdFilter'
            - $ref: '#/components/schemas/SentimentV2TopicIdFilter'
            - $ref: '#/components/schemas/SentimentV2PromptIdFilter'
            - $ref: '#/components/schemas/SentimentV2PersonaIdFilter'
            - $ref: '#/components/schemas/SentimentV2TagIdFilter'
            - $ref: '#/components/schemas/SentimentV2RunIdFilter'
            - $ref: '#/components/schemas/SentimentV2ThemeFilter'
            - $ref: '#/components/schemas/SentimentV2ClaimFilter'
            - $ref: '#/components/schemas/SentimentV2ThemeIdFilter'
            - $ref: '#/components/schemas/SentimentV2ClaimIdFilter'
            - $ref: '#/components/schemas/SentimentV2SentimentFilter'
            discriminator:
              propertyName: field
              mapping:
                claim: '#/components/schemas/SentimentV2ClaimFilter'
                claim_id: '#/components/schemas/SentimentV2ClaimIdFilter'
                model_id: '#/components/schemas/SentimentV2ModelIdFilter'
                persona_id: '#/components/schemas/SentimentV2PersonaIdFilter'
                prompt_id: '#/components/schemas/SentimentV2PromptIdFilter'
                region_id: '#/components/schemas/SentimentV2RegionIdFilter'
                run_id: '#/components/schemas/SentimentV2RunIdFilter'
                sentiment: '#/components/schemas/SentimentV2SentimentFilter'
                tag_id: '#/components/schemas/SentimentV2TagIdFilter'
                theme: '#/components/schemas/SentimentV2ThemeFilter'
                theme_id: '#/components/schemas/SentimentV2ThemeIdFilter'
                topic_id: '#/components/schemas/SentimentV2TopicIdFilter'
          type: array
          title: Filters
          description: List of filters to apply to the sentiment-v2 report.
        order_by:
          additionalProperties:
            type: string
            enum:
            - asc
            - desc
          propertyNames:
            enum:
            - sentiment
            - occurrence
            - assessment_count
            - positive_sentiment
            - negative_sentiment
            - date
            - topic
            - region
            - model
            - prompt
            - persona
            - tag
            - theme
            - claim
            - run
            - asset_name
          type: object
          title: Order By
          description: Custom ordering of report results. Dimension keys must also be present in dimensions. The sentiment metric orders by positive_sentiment.
          examples:
          - occurrence: desc
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination settings for the report results.
