apis:
- aid: profound-external-api
  name: Profound External API
  description: >-
    The programmatic interface to Profound's Answer Engine Optimization data:
    brand visibility, citations, sentiment, query fan-outs, FactCheck accuracy,
    shopping visibility, YouTube social reports, AI crawler (bot) and human
    referral traffic, plus knowledge bases, documents, projects, content
    optimization and runnable Profound Agents. 125 operations across v1 and v2,
    with server-sent-event /stream variants on every v2 query endpoint.
    Authentication is an X-API-Key header; access is Enterprise-only on request.
  humanURL: https://docs.tryprofound.com/rest-api/introduction
  baseURL: https://api.tryprofound.com
  tags:
  - Analytics
  - Answer Engine Optimization
  - Brand Visibility
  - Citations
  - Agents
