name: Profound
description: 'Profound is a marketing platform for the AI era and a leading platform
  for Answer Engine Optimization (AEO). Operated by Cooper Square Technologies Inc.
  (dba Profound) in New York, it helps brands measure and improve how they are represented
  across AI answer engines and assistants — ChatGPT, Perplexity, Claude, Gemini, Google
  AI Overviews and AI Mode, Copilot, and Grok — through answer-engine insights, agent
  analytics, prompt volumes, shopping visibility, and content optimization. Profound
  publishes a 125-operation OpenAPI 3.1 for its External API at api.tryprofound.com,
  runs a separate Agent Analytics Ingestion API, ships official Python and TypeScript
  SDKs, and operates a hosted remote MCP server at mcp.tryprofound.com with OAuth 2.1
  and a conformant A2A agent card. API access is included on the Enterprise plan on
  request. Profound is SOC 2 and HIPAA aligned and publishes a responsible-disclosure
  policy. Backed by Kleiner Perkins.'
