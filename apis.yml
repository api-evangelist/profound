- aid: profound-agent-analytics-ingestion-api
  name: Profound Agent Analytics Ingestion API
  description: >-
    The inbound log-ingestion endpoint for Profound Agent Analytics. Customers
    POST batches of up to 1,000 web-request log entries as JSON (timestamp,
    method, host, path, status_code, ip, user_agent, plus optional query_params,
    referer, bytes_sent and duration_ms) so Profound can attribute AI crawler
    and human referral traffic. Authenticated with a Profound Log Ingestion
    Token in the x-api-key header. Listed as a separately monitored component on
    the Profound status page. No OpenAPI is published for this surface.
  humanURL: https://docs.tryprofound.com/agent-analytics/custom
  baseURL: https://artemis.api.tryprofound.com
  tags:
  - Agent Analytics
  - Log Ingestion
  - Bot Traffic
  properties:
