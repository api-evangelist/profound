  sources: [https://mcp.tryprofound.com/.well-known/oauth-authorization-server]
- scope: profile
  description: Basic profile claims for the signed-in Profound user.
  flows: [authorizationCode]
  sources: [https://mcp.tryprofound.com/.well-known/oauth-authorization-server]
- scope: email
